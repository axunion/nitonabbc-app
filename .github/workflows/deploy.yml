name: Deploy

on:
  push:

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler d1 migrations apply nitonabbc-db --remote

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy --config dist/nitonabbc_app/wrangler.json

      - name: Upload preview version
        if: github.ref != 'refs/heads/main'
        run: pnpm exec wrangler versions upload --config dist/nitonabbc_app/wrangler.json
